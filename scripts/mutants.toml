# Mutant catalogue for scripts/mutation_check.py
#
# One entry per fixed bug that claims a regression test. Each mutant
# reintroduces the original defect as a literal source edit. A regression test
# earns its name only when its mutant is KILLED.
#
# expect = "killed"         -> the suite must fail. CI fails if the mutant survives.
# expect = "known-survivor" -> a documented coverage gap. CI fails if it is
#                              *unexpectedly* killed, forcing the entry to be
#                              promoted rather than left to rot.

