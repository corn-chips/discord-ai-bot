[[mutant]]
id = "M-RWS03"
bug = "PPR-19"
# `::ffff:127.0.0.1` is loopback to `ipaddress`, so it clears the pre-check,
# and the kernel then refuses the bind with `OSError: [Errno 22] invalid
# argument`. Propagated, it reaches on_ready as "Failed to start report web UI"
# plus a traceback -- which reads as a bug in this server rather than as an
# address the operator can fix.
summary = "Let an unbindable loopback address escape start() as an OSError"
guard = "test_an_unbindable_loopback_address_is_refused_not_raised"
file = "src/services/report_web_server.py"
expect = "killed"
[[mutant.edit]]
find = "class ReportWebServer:"
replace = "class _UnreachableError(Exception):\n    pass\n\n\nclass ReportWebServer:"
[[mutant.edit]]
# Anchored on the comment as well as the clause: the resolution above the bind
# has an `except OSError as exc:` of its own now, and the bare clause matched
# both (the harness refused the ambiguity rather than mutating the wrong one).
find = "\n        except OSError as exc:\n            # A refusal, not a fault."
replace = "\n        except _UnreachableError as exc:\n            # A refusal, not a fault."

