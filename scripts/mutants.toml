expect = "killed"
[[mutant.edit]]
find = "                    conn.execute(\n                        f'INSERT OR IGNORE INTO main.\"{table_name}\" ({columns_sql}) '\n                        f'SELECT {columns_sql} FROM legacy.\"{table_name}\"'\n                    )\n"
replace = "                    expected = conn.execute(\n                        f'SELECT COUNT(*) FROM legacy.\"{table_name}\"'\n                    ).fetchone()[0]\n                    before = conn.execute(\n                        f'SELECT COUNT(*) FROM main.\"{table_name}\"'\n                    ).fetchone()[0]\n                    conn.execute(\n                        f'INSERT OR IGNORE INTO main.\"{table_name}\" ({columns_sql}) '\n                        f'SELECT {columns_sql} FROM legacy.\"{table_name}\"'\n                    )\n                    after_count = conn.execute(\n                        f'SELECT COUNT(*) FROM main.\"{table_name}\"'\n                    ).fetchone()[0]\n                    if after_count - before != expected:\n                        shortfalls.append(\n                            f\"{table_name}: expected {expected} rows, copied \"\n                            f\"{after_count - before}\"\n                        )\n                    continue\n"

