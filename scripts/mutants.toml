# Restores the original: the SYNCHRONOUS SDK on the loop's default
# ThreadPoolExecutor, with no deadline. That pool is shared with every other
# to_thread in the process -- ~20 SQLite calls across message_index_service,
# token_tracker and the pin loads -- and is min(32, cpu_count + 4), so 6-8
