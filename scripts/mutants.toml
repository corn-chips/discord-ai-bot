bug = "BUG-0001"
summary = "The same budget theft spelled `async with asyncio.timeout(...)` rather than wait_for"
# The spelling the deleted guard could not see. It patched asyncio.wait_for by
# name, so an outer deadline written as a context manager reintroduced BUG-0001
# with the suite fully green. This mutant proves the replacement guard is
# strictly stronger than the test it replaces, not merely different.
guard = "test_main_response_path_preserves_the_full_client_retry_budget"
file = "src/bot/response_generation.py"
