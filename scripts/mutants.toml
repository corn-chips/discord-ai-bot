# Mutant catalogue for scripts/mutation_check.py
#
# One entry per fixed bug that claims a regression test. Each mutant
# reintroduces the original defect as a literal source edit. A regression test
# earns its name only when its mutant is KILLED.
#
# expect = "killed"         -> the suite must fail. CI fails if the mutant survives.
# expect = "known-survivor" -> a documented coverage gap. CI fails if it is
#                              *unexpectedly* killed, forcing the entry to be
#                              promoted rather than left to rot.

[[mutant]]
id = "M-BUG0001"
bug = "BUG-0001"
summary = "Outer wait_for reclaims ownership of the Gemini retry budget"
# Retargeted 2026-07-31. The previous guard,
# test_main_response_path_does_not_wrap_client_retry_timeout, was deleted: it
# banned asyncio.wait_for outright by patching the singleton module, so it also
# failed every CORRECT whole-sequence deadline and blocked DAB-042. Its
# replacement asserts the budget instead. Deleting that test without moving this
# guard would have left M-BUG0001 an unkillable survivor -- 56/56 -> 55/56 at the time,
# 130/130 -> 129/130 today -- and
# turned the mutation gate red on a commit that passes unittest.
guard = "test_main_response_path_preserves_the_full_client_retry_budget"
file = "src/bot/response_generation.py"
expect = "killed"
[[mutant.edit]]
find = "                    api_response = await self.gemini_client.generate_response(\n"
replace = "                    api_response = await asyncio.wait_for(self.gemini_client.generate_response(\n"
[[mutant.edit]]
find = "                        language=user_language,\n                    )\n                    await self._delete_status_message(status_message, \"after response\")\n"
replace = "                        language=user_language,\n                    ), timeout=30)\n                    await self._delete_status_message(status_message, \"after response\")\n"

[[mutant]]
