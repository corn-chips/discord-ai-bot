id = "M-PPR02"
bug = "PPR-02"
# The post-condition as shipped: `after - before` against the legacy row
# count. It cannot be satisfied by its own retry. On the second boot after a
# shortfall the rows are already in main, `INSERT OR IGNORE` copies nothing,
# and the comparison is `0 != N` -- a table holding 100% of its legacy rows
# reports itself short, forever. The ledger is never written, so every boot
# re-runs the ATTACH, the copy, the reconcile and a full FTS rebuild.
#
# NOTE the `continue`: without it the natural-key check below also runs and
# masks the defect. The first draft of this mutant omitted the `before` count
# instead, which made it pass the very test it exists to fail.
